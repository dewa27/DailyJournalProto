<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student List — Daily Journal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#10af13",
                        primaryDark: "#0d8610",
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                        serif: ['DM Serif Display', 'serif'],
                    }
                },
            },
        };
    </script>
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
        }

        .student-card {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            cursor: pointer;
        }

        .student-card:hover {
            border-color: #10af13;
            box-shadow: 0 4px 12px rgba(16, 175, 19, 0.15);
        }

        .student-card.sent {
            background: #f0fdf4;
            border-color: #10af13;
        }

        .student-info {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .student-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10af13, #4ec148);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .student-details h3 {
            font-weight: 700;
            color: #1f2937;
            margin: 0 0 4px 0;
        }

        .student-details p {
            font-size: 13px;
            color: #6b7280;
            margin: 0;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 12px;
            background: #f3f4f6;
            color: #6b7280;
        }

        .status-badge.completed {
            background: #dcfce7;
            color: #166534;
        }

        .action-btn {
            background: linear-gradient(135deg, #10af13, #4ec148);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .action-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 175, 19, 0.3);
        }

        .action-btn.secondary {
            background: linear-gradient(135deg, #3b82f6, #60a5fa);
        }

        .action-btn.secondary:hover {
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        /* Responsive tweaks for small screens (<= 480px) */
        @media (max-width: 480px) {
            /* Stack header content vertically on very small screens */
            .header-flex-mobile {
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }

            main.max-w-4xl {
                padding-left: 12px;
                padding-right: 12px;
            }

            /* Keep the card horizontal so action buttons stay pinned right */
            .student-card {
                flex-direction: row;
                align-items: center;
                gap: 12px;
            }

            .student-info {
                flex: 1 1 auto;
                min-width: 0;
            }

            .student-avatar {
                width: 40px;
                height: 40px;
                font-size: 14px;
            }

            .student-details h3 {
                font-size: 15px;
            }

            .student-details p {
                font-size: 12px;
            }

            .action-btn, .action-btn.secondary {
                padding: 8px 12px;
                font-size: 13px;
            }

            /* Allow action buttons to wrap if needed but keep them on the right */
            .student-card .actions-wrap {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                justify-content: flex-end;
            }
            .name-row {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
            }
        }
    </style>
</head>

<body class="bg-gray-50">
    <!-- Header -->
    <header class="bg-primary text-white sticky top-0 z-30 shadow-lg">
        <div class="px-4 py-4">
            <div class="flex header-flex-mobile items-center justify-between">
                <div class="flex items-center gap-3">
                    <img src="https://images.glints.com/unsafe/glints-dashboard.oss-ap-southeast-1.aliyuncs.com/company-logo/ff8acfa4d23038434c6f96322576f955.png" alt="Company Logo" class="h-10 w-auto" />
                    <div>
                        <p class="font-semibold text-base leading-tight">Mr. Muscle</p>
                        <p class="text-emerald-100 text-sm">Teacher • Class 27A - Python</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="font-semibold text-base leading-tight">23 Maret 2026</p>
                    <p class="text-emerald-100 text-sm">09:00 WIB</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4 pb-20">
        <div class="mb-8">
            <h2 class="text-3xl font-serif font-bold text-gray-800 mb-2">Create Daily Journal</h2>
            <p class="text-gray-500">Select a student to create and send their journal</p>
        </div>

        <!-- Stats -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div class="bg-white border-2 border-gray-200 rounded-2xl p-4 text-center">
                <div class="text-2xl font-bold text-primary" id="totalStudents">0</div>
                <p class="text-sm text-gray-600">Total Students</p>
            </div>
            <div class="bg-white border-2 border-gray-200 rounded-2xl p-4 text-center">
                <div class="text-2xl font-bold text-blue-600" id="createdCount">0</div>
                <p class="text-sm text-gray-600">Created</p>
            </div>
            <div class="bg-white border-2 border-green-600 rounded-2xl p-4 text-center">
                <div class="text-2xl font-bold text-green-600" id="sentCount">0</div>
                <p class="text-sm text-gray-600">Sent to Parents</p>
            </div>
        </div>

        <!-- Students List -->
        <div class="space-y-3" id="studentsList"></div>
    </main>

    <script>
        // Sample student data - you can replace this with API data
        const students = [
            { id: 1, name: "Jena Widodo", parentPhone: "6281234567890", class: "27A" },
            { id: 2, name: "Ayu Christmasari", parentPhone: "6289876543210", class: "27A" },
            { id: 3, name: "Gita Adetistiadat", parentPhone: "6285555555555", class: "27A" },
            { id: 4, name: "Karina Yuvi White", parentPhone: "6281111111111", class: "27A" },
            { id: 5, name: "Gibran", parentPhone: "6282222222222", class: "27A" },
            { id: 6, name: "Sony", parentPhone: "6283333333333", class: "27A" },
            { id: 7, name: "Dewa 19", parentPhone: "6284444444444", class: "27A" },
            { id: 8, name: "Dewa Krishna", parentPhone: "6287777777777", class: "27A" },
        ];

        let journalsData = {};

        function initPage() {
            loadJournalsFromStorage();
            renderStudents();
            updateStats();
        }

        function renderStudents() {
            const listContainer = document.getElementById('studentsList');
            const totalEl = document.getElementById('totalStudents');
            
            totalEl.textContent = students.length;

            listContainer.innerHTML = students.map(student => {
                const isCompleted = journalsData[student.id]?.completed || false;
                const isSent = journalsData[student.id]?.sent || false;
                const initials = student.name.split(' ').map(word => word[0]).join('');

                const statusHtml = isSent
                    ? '<i class="fas fa-check-circle"></i> Sent'
                    : isCompleted
                        ? '<i class="fas fa-file-check"></i> Created'
                        : '<i class="fas fa-file"></i> Not Created';

                return `
                    <div class="student-card ${isSent ? 'sent' : ''}">
                        <div class="student-info">
                            <div class="student-avatar">${initials}</div>
                            <div class="student-details">
                                <div class="name-row">
                                    <h3>${student.name}</h3>
                                    <div class="status-badge ${isSent ? 'completed' : ''}">${statusHtml}</div>
                                </div>
                                <p>📱 ${student.parentPhone.replace(/(\d{2})(\d{4})(\d{4})(\d{4})/, '+$1 $2 $3 $4')}</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="actions-wrap" style="display: flex; gap: 8px;">
                                ${!isCompleted ? `<button class="action-btn" onclick="createJournal(${student.id})">
                                    <i class="fas fa-plus-circle"></i>
                                    Create
                                </button>` : ''}
                                ${isCompleted && !isSent ? `
                                    <button class="action-btn secondary" onclick="sendToParents(${student.id})">
                                        <i class="fas fa-paper-plane"></i>
                                        Send
                                    </button>
                                    <button class="action-btn secondary" onclick="editJournal(${student.id})">
                                        <i class="fas fa-edit"></i>
                                        Edit
                                    </button>
                                ` : ''}
                                ${isSent ? `
                                    <button class="action-btn secondary" onclick="editJournal(${student.id})">
                                        <i class="fas fa-eye"></i>
                                        View
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function createJournal(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            // Store student data in localStorage
            localStorage.setItem('currentStudent', JSON.stringify(student));
            localStorage.setItem('journalData', JSON.stringify({
                lessons: [],
                photo: null,
                project: '',
                notes: '',
                aiSummary: ''
            }));

            // Redirect to journal page
            window.location.href = 'journal.html';
        }

        function editJournal(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            // Store student data in localStorage
            localStorage.setItem('currentStudent', JSON.stringify(student));
            
            // Redirect to journal page (will load existing data)
            window.location.href = 'journal.html';
        }

        function sendToParents(studentId) {
            const student = students.find(s => s.id === studentId);
            if (!student) return;

            // Show confirmation
            const confirmed = confirm(`Send journal for ${student.name} to parent?`);
            if (!confirmed) return;

            // Mark as sent
            if (!journalsData[studentId]) journalsData[studentId] = {};
            journalsData[studentId].sent = true;
            journalsData[studentId].sentAt = new Date().toISOString();
            localStorage.setItem('journalsData', JSON.stringify(journalsData));

            // Update display
            renderStudents();
            updateStats();
            
            alert(`✓ Journal for ${student.name} sent to parent!`);
        }

        function loadJournalsFromStorage() {
            const saved = localStorage.getItem('journalsData');
            if (saved) {
                journalsData = JSON.parse(saved);
            }
        }

        function updateStats() {
            const created = Object.values(journalsData).filter(j => j.completed).length;
            const sent = Object.values(journalsData).filter(j => j.sent).length;

            document.getElementById('createdCount').textContent = created;
            document.getElementById('sentCount').textContent = sent;
        }

        // Initialize page on load
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
</body>

</html>
